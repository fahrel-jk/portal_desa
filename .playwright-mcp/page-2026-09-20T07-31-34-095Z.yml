            - generic [ref=f8e74]:
              - heading "Gambaran Umum" [level=3] [ref=f8e75]
              - paragraph [ref=f8e76]: Kampung ini dikenal dengan konsep Wisata Batas Kampung (WBK) yang menawarkan suasana pedesaan asri, rindang, dan sejuk di tengah kota. Kampung Sumberan memiliki tradisi budaya lokal yang khas seperti kegiatan Bersih Desa atau Ruwah Desa.
              - separator [ref=f8e77]
              - heading "Sejarah Perkembangan" [level=3] [ref=f8e78]
              - paragraph [ref=f8e79]: Desa Sumberan berdiri sejak masa pemerintahan kolonial Belanda pada awal abad ke-20. Nama "Sumberan" berasal dari kata "sumber" yang merujuk pada mata air alami yang menjadi pusat kehidupan penduduk awal di wilayah ini. Pada tahun 1945, warga Desa Sumberan turut aktif dalam perjuangan kemerdekaan sebagai bagian dari gerakan pertahanan rakyat di wilayah Jawa Timur. Setelah kemerdekaan, desa ini berkembang pesat sebagai sentra pertanian padi dan palawija. Memasuki era reformasi, Desa Sumberan bertransformasi menjadi desa yang mengedepankan transparansi pemerintahan. Pada tahun 2018, desa ini meraih penghargaan sebagai Desa Terbaik tingkat kecamatan dalam bidang tata kelola keuangan desa. Saat ini, Desa Sumberan terus berinovasi dengan memanfaatkan teknologi digital untuk pelayanan warga, termasuk melalui portal desa ini sebagai wujud komitmen keterbukaan informasi publik.
