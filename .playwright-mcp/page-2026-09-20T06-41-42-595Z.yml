              - text: Gambaran umum dan profil historis wilayah
            - generic [ref=f3e85]:
              - generic [ref=f3e86]:
                - generic [ref=f3e87]: Gambaran Umum
                - generic [ref=f3e88]: Kampung ini dikenal dengan konsep Wisata Batas Kampung (WBK) yang menawarkan suasana pedesaan asri, rindang, dan sejuk di tengah kota. Kampung Sumberan memiliki tradisi budaya lokal yang khas seperti kegiatan Bersih Desa atau Ruwah Desa.
              - generic [ref=f3e89]:
                - generic [ref=f3e90]: Sejarah Perkembangan
                - generic [ref=f3e91]: Desa Sumberan berdiri sejak masa pemerintahan kolonial Belanda pada awal abad ke-20. Nama "Sumberan" berasal dari kata "sumber" yang merujuk pada mata air alami yang menjadi pusat kehidupan penduduk awal di wilayah ini. Pada tahun 1945, warga Desa Sumberan turut aktif dalam perjuangan kemerdekaan sebagai bagian dari gerakan pertahanan rakyat di wilayah Jawa Timur. Setelah kemerdekaan, desa ini berkembang pesat sebagai sentra pertanian padi dan palawija. Memasuki era reformasi, Desa Sumberan bertransformasi menjadi desa yang mengedepankan transparansi pemerintahan. Pada tahun 2018, desa ini meraih penghargaan sebagai Desa Terbaik tingkat kecamatan dalam bidang tata kelola keuangan desa. Saat ini, Desa Sumberan terus berinovasi dengan memanfaatkan teknologi digital untuk pelayanan warga, termasuk melalui portal desa ini sebagai wujud komitmen keterbukaan informasi publik.
