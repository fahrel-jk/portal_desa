    - generic [ref=f16e651]:
      - searchbox "Cari pertanyaan…" [ref=f16e653]
      - generic [ref=f16e654]:
        - generic [ref=f16e655]:
          - button "Bagaimana cara mengurus Surat Keterangan Domisili?" [ref=f16e656] [cursor=pointer]
          - region "Bagaimana cara mengurus Surat Keterangan Domisili?":
            - paragraph [ref=f16e661]: Warga dapat datang langsung ke Balai Desa Sumberan dengan membawa KTP, KK, dan surat pengantar dari RT/RW. Proses pengurusan memakan waktu kurang lebih 15-30 menit pada jam kerja. Alternatifnya, warga dapat mengajukan secara online melalui fitur Layanan di portal desa ini.
        - generic [ref=f16e662]:
          - button "Kapan jadwal pelayanan administrasi di kantor desa?" [ref=f16e663] [cursor=pointer]
          - region "Kapan jadwal pelayanan administrasi di kantor desa?":
            - paragraph [ref=f16e668]: Kantor Desa Sumberan melayani warga setiap hari Senin sampai Jumat, pukul 08.00 – 15.00 WIB. Untuk hari Sabtu, kantor desa buka setengah hari (08.00 – 12.00 WIB) hanya untuk pelayanan darurat.
        - generic [ref=f16e669]:
          - button "Apakah desa menyediakan layanan pengaduan warga?" [ref=f16e670] [cursor=pointer]
          - region "Apakah desa menyediakan layanan pengaduan warga?":
            - paragraph [ref=f16e675]: Ya, Desa Sumberan menyediakan layanan pengaduan melalui fitur "Lapor Desa" yang tersedia di portal ini. Warga juga bisa menyampaikan aspirasi langsung pada saat Musyawarah Desa (Musdes) yang diadakan secara berkala.
        - generic [ref=f16e676]:
          - button "Bagaimana cara mendapatkan informasi bantuan sosial?" [ref=f16e677] [cursor=pointer]
          - region "Bagaimana cara mendapatkan informasi bantuan sosial?":
            - paragraph [ref=f16e682]: Informasi mengenai bantuan sosial (BLT, PKH, BPNT) dapat dilihat melalui halaman Berita di portal ini. Warga juga bisa menghubungi Sekretaris Desa untuk konfirmasi data penerima bantuan. Desa Sumberan berkomitmen menyalurkan bantuan secara transparan dan tepat sasaran.
        - generic [ref=f16e683]:
          - button "Di mana saya bisa melihat laporan keuangan desa?" [ref=f16e684] [cursor=pointer]
          - region "Di mana saya bisa melihat laporan keuangan desa?":
            - paragraph [ref=f16e689]: Laporan keuangan desa (APBDes) dapat diakses secara publik melalui menu "APBDes" di navigasi portal ini. Laporan mencakup rincian pendapatan, belanja, dan pembiayaan desa per tahun anggaran.
